slam_odom_bridge:
  ros__parameters:
    slam_pose_topic: "/orbslam3/pose"
    odom_frame: "odom"
    base_link_frame: "base_link"
    publish_map_to_odom: false
    # Visual SLAM is PRIMARY - always publishes odom->base_link TF
    # IMUs are optional enhancements, never required
    publish_tf: true
