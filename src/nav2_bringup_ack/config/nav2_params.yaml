amcl:
  ros__parameters:
    enabled: false
    use_sim_time: false

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 10.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      downsample_costmap: false
      allow_unknown: true
      tolerance: 0.25
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 5.0
      motion_model_for_search: "REEDS_SHEPP"  # or REEDS_SHEPP if reverse is allowed
      angle_quantization_bins: 72
      minimum_turning_radius: 3.40  # Calculated: wheelbase/tan(max_steer) = 0.6/tan(10°)
      reverse_penalty: 4.0
      change_penalty: 0.15
      non_straight_penalty: 1.2
      cost_penalty: 1.7
      retrospective_penalty: 0.025
      rotation_penalty: 5.0
      lookup_table_size: 20.0
      cache_obstacle_heuristic: false
      allow_primitive_interpolation: false
      smooth_path: true
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0  # Reduced from 20Hz for lower CPU usage
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.2
      movement_time_allowance: 10.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.3  # Tightened from 0.5
      yaw_goal_tolerance: 0.25  # Tightened from 0.35
      stateful: true

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      use_rotate_to_heading: false
      desired_linear_vel: 0.4
      max_linear_accel: 1.0
      max_angular_accel: 2.0
      min_lookahead_dist: 0.6
      max_lookahead_dist: 1.5
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 0.0 # Disable rotate in place
      transform_tolerance: 0.5  # Reduced from 2.0 for better TF sync
      use_collision_detection: true
      allow_reversing: true
      max_robot_pose_search_dist: 10.0
      use_interpolation: true

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_frame: odom
    transform_tolerance: 1.0
    goal_blackboard_id: goal
    goals_blackboard_id: goals
    path_blackboard_id: path
    navigators: ['navigate_to_pose', 'navigate_through_poses']
    navigate_to_pose:
      plugin: "nav2_bt_navigator/NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator/NavigateThroughPosesNavigator"
    default_bt_xml_filename: "/home/xavier/robot_ws/src/nav2_bringup_ack/config/navigate_to_pose_w_replanning_and_recovery_no_spin.xml"
    default_navigate_through_poses_bt_xml: "/home/xavier/robot_ws/src/nav2_bringup_ack/config/navigate_through_poses_w_replanning_and_recovery_no_spin.xml"
    default_nav_to_pose_bt_xml: "/home/xavier/robot_ws/src/nav2_bringup_ack/config/navigate_to_pose_w_replanning_and_recovery_no_spin.xml"
    default_nav_through_poses_bt_xml: "/home/xavier/robot_ws/src/nav2_bringup_ack/config/navigate_through_poses_w_replanning_and_recovery_no_spin.xml"

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_link
      update_frequency: 5.0  # Reduced from 10Hz to match controller
      publish_frequency: 2.0  # Reduced from 5Hz
      transform_tolerance: 0.5  # Reduced from 2.0
      rolling_window: true
      width: 10
      height: 10
      resolution: 0.05
      footprint: "[[-0.4, -0.58], [0.4, -0.58], [0.4, 0.58], [-0.4, 0.58]]" # 0.8m x 1.16m
      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          reliability: best_effort
          marking: true
          clearing: true
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          clearing_max_height: 2.0
          obstacle_max_range: 5.5           # Increased to match 6m sensor range
          raytrace_max_range: 6.0           # Match sensor max range

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.80              # Increased for smoother paths
        cost_scaling_factor: 2.5            # Gentler falloff for smoother navigation

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_link
      update_frequency: 5.0
      publish_frequency: 2.0
      transform_tolerance: 0.5  # Reduced from 2.0
      resolution: 0.05
      track_unknown_space: true
      rolling_window: true
      width: 30
      height: 30
      footprint: "[[-0.4, -0.58], [0.4, -0.58], [0.4, 0.58], [-0.4, 0.58]]" # 0.8m x 1.16m
      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          reliability: best_effort
          marking: true
          clearing: true
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          clearing_max_height: 2.0
          obstacle_max_range: 5.5           # Match local costmap for consistency
          raytrace_max_range: 6.0           # Match sensor max range

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.50
        cost_scaling_factor: 5.0

behavior_server:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    behavior_plugins: ["backup", "drive_on_heading", "wait"]
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"


lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names: ["controller_server", "planner_server", "behavior_server", "bt_navigator"]
