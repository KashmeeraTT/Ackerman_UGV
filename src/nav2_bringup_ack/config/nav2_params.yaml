amcl:
  ros__parameters:
    enabled: false
    use_sim_time: false

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 10.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      downsample_costmap: false
      allow_unknown: true
      tolerance: 0.25
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 5.0
      motion_model_for_search: "REEDS_SHEPP"  # or REEDS_SHEPP if reverse is allowed
      angle_quantization_bins: 72
      minimum_turning_radius: 4.27  # Calculated: wheelbase/tan(max_steer) = 0.6/tan(8°)
      reverse_penalty: 4.0
      change_penalty: 0.15
      non_straight_penalty: 1.2
      cost_penalty: 1.7
      retrospective_penalty: 0.025
      rotation_penalty: 5.0
      lookup_table_size: 20.0
      cache_obstacle_heuristic: false
      allow_primitive_interpolation: false
      smooth_path: true
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0  # Must be >= 1/model_dt (20Hz = 50ms = model_dt)
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.2
      movement_time_allowance: 10.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.3  # Tightened from 0.5
      yaw_goal_tolerance: 0.25  # Tightened from 0.35
      stateful: true

    FollowPath:
      # MPPI Controller - Predictive, Ackermann-native
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 56
      model_dt: 0.05  # 50ms - controller period must be <= this
      batch_size: 2000
      vx_std: 0.2
      wz_std: 0.4
      vx_max: 0.5
      vx_min: -0.35
      wz_max: 1.0
      ax_max: 0.6
      ax_min: -0.75
      az_max: 1.8
      iteration_count: 1
      prune_distance: 1.7
      transform_tolerance: 0.3
      motion_model: "Ackermann"
      visualize: false
      AckermannConstraints:
        min_turning_radius: 4.27  # Updated for 8° steering soft limit
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic"]
      ConstraintCritic:
        enabled: true
        cost_weight: 4.0
        cost_power: 1
      CostCritic:
        enabled: true
        cost_weight: 3.0
        cost_power: 1
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0
      GoalCritic:
        enabled: true
        cost_weight: 5.0
        cost_power: 1
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_weight: 3.0
        cost_power: 1
        threshold_to_consider: 0.5
      PathFollowCritic:
        enabled: true
        cost_weight: 5.0
        cost_power: 1
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_weight: 2.0
        cost_power: 1
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
      PreferForwardCritic:
        enabled: true
        cost_weight: 5.0
        cost_power: 1
        threshold_to_consider: 0.5

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_frame: odom
    transform_tolerance: 1.0
    goal_blackboard_id: goal
    goals_blackboard_id: goals
    path_blackboard_id: path
    navigators: ['navigate_to_pose', 'navigate_through_poses']
    navigate_to_pose:
      plugin: "nav2_bt_navigator/NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator/NavigateThroughPosesNavigator"
    default_bt_xml_filename: "/home/xavier/robot_ws/src/nav2_bringup_ack/config/navigate_to_pose_w_replanning_and_recovery_no_spin.xml"
    default_navigate_through_poses_bt_xml: "/home/xavier/robot_ws/src/nav2_bringup_ack/config/navigate_through_poses_w_replanning_and_recovery_no_spin.xml"
    default_nav_to_pose_bt_xml: "/home/xavier/robot_ws/src/nav2_bringup_ack/config/navigate_to_pose_w_replanning_and_recovery_no_spin.xml"
    default_nav_through_poses_bt_xml: "/home/xavier/robot_ws/src/nav2_bringup_ack/config/navigate_through_poses_w_replanning_and_recovery_no_spin.xml"

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_link
      update_frequency: 5.0  # Reduced from 10Hz to match controller
      publish_frequency: 2.0  # Reduced from 5Hz
      transform_tolerance: 0.5  # Reduced from 2.0
      rolling_window: true
      width: 10
      height: 10
      resolution: 0.05
      footprint: "[[-0.4, -0.58], [0.4, -0.58], [0.4, 0.58], [-0.4, 0.58]]" # 0.8m x 1.16m
      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          reliability: best_effort
          marking: true
          clearing: true
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          clearing_max_height: 2.0
          obstacle_max_range: 5.5           # Increased to match 6m sensor range
          raytrace_max_range: 6.0           # Match sensor max range

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.80              # Increased for smoother paths
        cost_scaling_factor: 2.5            # Gentler falloff for smoother navigation

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_link
      update_frequency: 5.0
      publish_frequency: 2.0
      transform_tolerance: 0.5  # Reduced from 2.0
      resolution: 0.05
      track_unknown_space: true
      rolling_window: true
      width: 30
      height: 30
      footprint: "[[-0.4, -0.58], [0.4, -0.58], [0.4, 0.58], [-0.4, 0.58]]" # 0.8m x 1.16m
      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          reliability: best_effort
          marking: true
          clearing: true
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          clearing_max_height: 2.0
          obstacle_max_range: 5.5           # Match local costmap for consistency
          raytrace_max_range: 6.0           # Match sensor max range

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.75              # Increased from 0.50 to exceed robot half-width (0.58m)
        cost_scaling_factor: 4.0            # Slightly gentler falloff

behavior_server:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    behavior_plugins: ["backup", "drive_on_heading", "wait"]
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.5, 0.0, 1.0]
    min_velocity: [-0.35, 0.0, -1.0]
    max_accel: [0.6, 0.0, 1.8]
    max_decel: [-0.75, 0.0, -1.8]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]

collision_monitor:
  ros__parameters:
    use_sim_time: false
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel_nav"
    transform_tolerance: 0.5
    source_timeout: 2.0
    stop_pub_timeout: 2.0
    polygons: ["PolygonStop", "PolygonSlow"]
    PolygonStop:
      type: "polygon"
      points: [0.5, 0.6, 0.5, -0.6, -0.1, -0.6, -0.1, 0.6]
      action_type: "stop"
      max_points: 3
      visualize: true
      polygon_pub_topic: "polygon_stop"
    PolygonSlow:
      type: "polygon"
      points: [1.0, 0.7, 1.0, -0.7, -0.2, -0.7, -0.2, 0.7]
      action_type: "slowdown"
      max_points: 3
      slowdown_ratio: 0.3
      visualize: true
      polygon_pub_topic: "polygon_slow"
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "/scan"

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names: ["controller_server", "planner_server", "behavior_server", "bt_navigator", "velocity_smoother", "collision_monitor"]

